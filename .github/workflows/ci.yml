name: CI

# Every push builds both apps, so a broken build is caught before a tag is cut.
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: Desktop (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Check the bundled fonts are the format they claim
        run: node scripts/check-fonts.mjs

      - run: npm ci
        working-directory: apps/desktop

      - run: npm run build
        working-directory: apps/desktop

      - name: Verify the generated dataset is in sync with its generator
        run: |
          # A stale committed dataset would ship two apps showing different
          # universes, so the generator has to reproduce it exactly.
          cp shared/data/dcc-data.json /tmp/committed.json
          node scripts/generate-data.mjs
          diff -q /tmp/committed.json shared/data/dcc-data.json \
            || { echo "::error::shared/data/dcc-data.json is stale — run 'npm run gen:data && node scripts/sync-assets.mjs'"; exit 1; }
          diff -q shared/data/dcc-data.json apps/android/app/src/main/assets/dcc-data.json \
            || { echo "::error::the Android copy of the dataset is stale — run 'node scripts/sync-assets.mjs'"; exit 1; }

      - name: Verify the Android theme is generated from the shared tokens
        run: |
          # Android's palette used to be hand-copied from shared/tokens.json and
          # drifted the moment either side changed. It is generated now, and
          # this fails the build if the committed file and the generator ever
          # disagree again.
          node scripts/generate-theme.mjs --check

      - name: Verify versions are in sync
        run: |
          node scripts/sync-version.mjs
          git diff --exit-code -- apps/android/version.properties apps/desktop/package.json \
            || { echo "::error::version files are out of sync — run 'npm run sync:version'"; exit 1; }

      - name: Check the obfuscated-table reader
        run: npm run check:assets
        working-directory: apps/desktop

      - name: Check the game-table reader
        run: npm run check:save
        working-directory: apps/desktop

      - name: Check the save writer
        run: npm run check:write
        working-directory: apps/desktop

      - name: Check the relay
        run: npm run check:relay
        working-directory: apps/desktop

      - name: Check the snapshot classification
        run: npm run check:snapshot
        working-directory: apps/desktop

      - name: Smoke test the built app
        run: |
          # Boots the real Electron app and clicks through every section, which
          # catches a blank window that a type-check never would.
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null
          xvfb-run -a ./node_modules/electron/dist/electron smoke.cjs --no-sandbox
        working-directory: apps/desktop

  installer:
    name: Windows installer (package)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci
        working-directory: apps/desktop

      - name: Package the installer
        working-directory: apps/desktop
        run: npm run dist

      - name: Check the installer and its updater manifest exist
        shell: bash
        working-directory: apps/desktop
        run: |
          # Packaging is the step that a toolchain upgrade breaks, and until now
          # it only ran at release time — where a failure means a tag with no
          # artifacts behind it. Building it on every push moves that discovery
          # to the commit that causes it.
          ls -l release/*.exe release/latest.yml
          test -s release/latest.yml

  android:
    name: Android (assemble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble release APK
        working-directory: apps/android
        env:
          # Mirrors the release workflow, where these are empty when the repo
          # has no signing secret. Blank must fall back to the committed key.
          DCC_KEYSTORE_FILE: ''
          DCC_KEYSTORE_PASSWORD: ''
          DCC_KEY_ALIAS: ''
          DCC_KEY_PASSWORD: ''
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify the APK is signed with the expected key
        run: |
          # An APK signed by a different key cannot install over an installed
          # one, so a key change has to fail loudly rather than ship.
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          APK=apps/android/app/build/outputs/apk/release/app-release.apk
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -m1 -i 'SHA-256 digest' | awk '{print $NF}' | tr 'a-f' 'A-F')
          EXPECTED=$(tr -d ':\n' < apps/android/keystore/fingerprint.txt)
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signing certificate changed — installs would no longer upgrade in place."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-ci
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  android-launch:
    name: Android (launch on emulator)
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-apk-ci
          path: apk

      - name: Give the APK a fixed name
        run: mv apk/*.apk apk/DCC-launch-check.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the release APK and open it
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # The action feeds this to sh line by line, so the checks live in a
          # script file rather than inline shell.
          script: bash scripts/android-launch-check.sh apk/DCC-launch-check.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-logcat
          path: |
            logcat.txt
            launch.png
          if-no-files-found: ignore
