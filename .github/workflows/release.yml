name: Release

# Three ways in:
#   - push a v* tag (the normal flow, see docs/RELEASING.md)
#   - run this workflow by hand from the Actions tab
#   - push a commit whose message contains [release]
#
# The last two take the version from package.json and create the tag at the
# commit they built. Either way both apps are built and published to a GitHub
# Release with the CHANGELOG section for that version as the notes.
on:
  push:
    tags: ['v*']
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check version
    # An ordinary push must not publish anything: a branch push only releases
    # when the commit says so.
    if: >-
      github.ref_type == 'tag' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # A tag build must agree with the tree it points at.
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION. Cut releases with 'npm run release'."
              exit 1
            fi
          fi
          # Fail before building rather than publishing a release with no notes.
          node scripts/release-notes.mjs "$VERSION" > /dev/null
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION from ${{ github.ref_name }}"

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the private signing key when the repo has one
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Android only installs an update over an existing app when both are
          # signed by the same key. A repo secret wins; otherwise the committed
          # key in apps/android/keystore is used, so updates always work.
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "injected=true" >> "$GITHUB_OUTPUT"
          else
            echo "injected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: apps/android
        env:
          DCC_KEYSTORE_FILE: ${{ steps.key.outputs.injected == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          DCC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DCC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DCC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify the APK is signed with the expected key
        if: steps.key.outputs.injected == 'false'
        run: |
          # A key change would stop the APK installing over an installed one.
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          APK=apps/android/app/build/outputs/apk/release/app-release.apk
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -m1 -i 'SHA-256 digest' | awk '{print $NF}' | tr 'a-f' 'A-F')
          EXPECTED=$(tr -d ':\n' < apps/android/keystore/fingerprint.txt)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signing certificate changed — installs would no longer upgrade in place."
            exit 1
          fi

      - name: Name the APK after the version
        run: |
          mkdir -p out
          cp apps/android/app/build/outputs/apk/release/app-release.apk \
             "out/DCC-${{ needs.check.outputs.version }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci
        working-directory: apps/desktop

      - name: Build installer
        working-directory: apps/desktop
        run: npm run dist

      - name: Collect installer, updater manifest and delta package
        shell: bash
        run: |
          mkdir -p out
          # latest.yml and the blockmap are what electron-updater reads to find
          # and delta-download the next version, so both ship with the exe.
          cp apps/desktop/release/*.exe out/
          cp apps/desktop/release/latest.yml out/
          cp apps/desktop/release/*.blockmap out/ 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [check, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release notes
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          {
            node scripts/release-notes.mjs "$VERSION"
            echo
            echo "---"
            echo
            echo "### Install"
            echo
            echo "**Windows** — download \`DCC-Setup-$VERSION.exe\` and run it."
            echo "It installs over any previous version, so you never have to uninstall first,"
            echo "and it keeps your queue, board, theme and settings. The app checks for updates"
            echo "on launch and can install the next one itself."
            echo
            echo "The installer is not code-signed, so the first run shows"
            echo "*Windows protected your PC* — choose **More info → Run anyway**."
            echo
            echo "**Android** — download \`DCC-$VERSION.apk\` and open it."
            echo "It installs over any previous version and keeps your data, because every"
            echo "release is signed with the same key. Settings → Updates checks for the next one."
            echo
            echo "The first install asks you to allow your browser or file manager to install"
            echo "apps — a one-time Android setting. To let the app update itself later, grant"
            echo "the same permission to Dynasty Command Center when it asks."
          } > NOTES.md
          cat NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          # On a manual run this creates the tag at the commit being built.
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.check.outputs.version }}
          body_path: NOTES.md
          files: |
            artifacts/android-apk/*
            artifacts/windows-installer/*
          fail_on_unmatched_files: true
